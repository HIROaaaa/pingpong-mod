# Gradle
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.parallel=true

# 钉死构建用的 JDK。
# 【为什么必须写】本机 PATH 里的 java 是 Oracle 的 launcher（javapath），默认落到 JDK 26，
# 而 Minecraft 1.20.1 / Fabric Loom 1.6.12 只吃 JDK 17 —— 不钉死就会报
# 「Unsupported class file major version」之类。写在这里比依赖 JAVA_HOME 更可靠：
# 无论谁调用（gradlew.bat、mc_gradle 工具、IDE）都自动用 17。
org.gradle.java.home=C:/Program Files/Java/jdk-17.0.3.1

# Fabric / Minecraft（1.20.1 官方推荐组合）
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.15.11
fabric_version=0.92.2+1.20.1

# Mod 版本：MAJOR.MINOR.PATCH
#   MAJOR = 不兼容变更（存档格式 / 网络协议）
#   MINOR = 新内容或行为变更（新方块、物理手感调整）
#   PATCH = 纯修复
# 这个值同时决定产物名 pingpong-<version>.jar 与 fabric.mod.json 里的 version
mod_version=1.9.10
maven_group=com.whale
archives_base_name=pingpong

# 【五期 M6】顺滑动作依赖：playerAnimator（KosmX，MIT）
# 【版本选择的实情】1.20.1 这条线上**只有 beta 版**（1.0.2-rc1），没有 release —— 查过 Modrinth
# API 的全部 1.20.1 版本（fabric + forge 各一个，都是 rc1）。所以这不是"选了 beta"，
# 而是"1.20.1 只有这个"。它的 refmap 用的是 yarn 名（class_572 这类），与我们的 yarn 工程同构。
# mod id 是 player-animator（带连字符！），不是 playeranimator —— 写错会让 fabric.mod.json 的
# depends 永远解析失败。
# 【为什么是构建时下载】Modrinth 的 maven 端点在当前网络下 404（见 build.gradle 注释），
# 而仓库门禁又禁止提交第三方 jar，所以由 build.gradle 的 downloadPlayerAnimator 任务
# 在构建时拉到 build/libs-external/ 下（下过一次即离线可用）；玩家侧仍从 Modrinth 自行安装。
playeranimator_version=1.0.2-rc1+1.20
