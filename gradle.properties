# Gradle
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
org.gradle.parallel=true

# Fabric / Minecraft（1.20.1 官方推荐组合）
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.15.11
fabric_version=0.92.2+1.20.1

# Mod 版本：MAJOR.MINOR.PATCH
#   MAJOR = 不兼容变更（存档格式 / 网络协议）
#   MINOR = 新内容或行为变更（新方块、物理手感调整）
#   PATCH = 纯修复
# 这个值同时决定产物名 pingpong-<version>.jar 与 fabric.mod.json 里的 version
mod_version=1.1.0
maven_group=com.whale
archives_base_name=pingpong
